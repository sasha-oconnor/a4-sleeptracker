<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1a1c1f"/>
  <!-- crescent moon: a full disc with an offset "shadow" disc cut out -->
  <mask id="cut">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="40" cy="25" r="16" fill="#000"/>
  </mask>
  <circle cx="30" cy="33" r="17" fill="#4fd1c5" mask="url(#cut)"/>
  <circle cx="47" cy="16" r="2" fill="#ffb86b"/>
  <circle cx="52" cy="28" r="1.3" fill="#ffb86b"/>
</svg>
