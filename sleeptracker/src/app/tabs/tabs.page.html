<ion-tabs>
  <!-- id is the anchor that keeps toasts above the tab bar -->
  <ion-tab-bar slot="bottom" id="tab-bar" [translucent]="true">
    <ion-tab-button tab="today">
      <ion-icon name="today" aria-hidden="true"></ion-icon>
      <ion-label>Today</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="journal">
      <ion-icon name="book" aria-hidden="true"></ion-icon>
      <ion-label>Journal</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="trends">
      <ion-icon name="stats-chart" aria-hidden="true"></ion-icon>
      <ion-label>Trends</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings">
      <ion-icon name="settings" aria-hidden="true"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
